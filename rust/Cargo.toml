[package]
name = "rust_lib_working_system_app"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
ezsockets = { version = "0.7", features = ["rustls"] }
# openssl = { version = "0.10", features = ["vendored"] }
flutter_rust_bridge = "=2.11.1"
image = { version = "0.25.8", default-features = false, features = ["png", "jpeg", "webp"] }
log = "0.4.28"
parking_lot = "0.12.5"
email_address = "0.2.4"
captcha = "1.0.0"

[profile.release]
opt-level = "z"     # Keep: Good size optimization
lto = "thin"        # Change: Much faster than 'true', nearly as good for size
# codegen-units = 1 # Remove: Allows parallel compilation
strip = true        # Keep: Free size reduction
panic = "abort"     # Keep: Reduces size and build time

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

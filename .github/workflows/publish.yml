name: "Build & Release"

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android (APK & AAB)
    runs-on: self-hosted
    environment: BuildEnv
    steps:
      # - name: Maximize build space
      #   run: |
      #     echo "Removing .NET SDKs..."
      #     sudo rm -rf /usr/share/dotnet

      #     echo "Removing Haskell (GHC/Cabal)..."
      #     sudo rm -rf /usr/share/ghc*
      #     sudo rm -rf /usr/local/lib/ghc*
      #     sudo rm -rf /opt/ghc
      #     sudo rm -rf /opt/cabal

      #     echo "Removing CodeQL..."
      #     sudo rm -rf /opt/hostedtoolcache/CodeQL

      #     echo "Removing all cached Docker images..."
      #     docker rmi -f $(docker images -q) || true

      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set Up Java
        uses: actions/setup-java@v3.12.0
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # - name: Accept Android Licenses
      #   run: |
      #     yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Update Android NDK Environment Variables
        run: |
          # Find the NDK directory (supports multiple NDK versions)
          if [ -d "$ANDROID_HOME/ndk" ]; then
            NDK_PATH=$(ls -d $ANDROID_HOME/ndk/* | sort -V | tail -n 1)
          elif [ -d "$ANDROID_SDK_ROOT/ndk" ]; then
            NDK_PATH=$(ls -d $ANDROID_SDK_ROOT/ndk/* | sort -V | tail -n 1)
          elif [ -d "/root/.android/sdk/ndk" ]; then
            NDK_PATH=$(ls -d /root/.android/sdk/ndk/* | sort -V | tail -n 1)
          else
            echo "❌ NDK not found!"
            exit 1
          fi
          
          echo "Found NDK at: $NDK_PATH"
          echo "ANDROID_NDK=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> $GITHUB_ENV
          
          # Set CMake toolchain file for Android builds
          CMAKE_TOOLCHAIN="$NDK_PATH/build/cmake/android.toolchain.cmake"
          if [ -f "$CMAKE_TOOLCHAIN" ]; then
            echo "CMAKE_TOOLCHAIN_FILE=$CMAKE_TOOLCHAIN" >> $GITHUB_ENV
            echo "Found CMake toolchain at: $CMAKE_TOOLCHAIN"
          else
            echo "⚠️  CMake toolchain not found at: $CMAKE_TOOLCHAIN"
          fi

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Fix Git Trust for Flutter SDK
        run: git config --global --add safe.directory '*'

      - name: Install Build Tools (CMake, Make, Ninja)
        run: |
          sudo apt update
          sudo apt install -y make ninja-build wget
          
          # Install latest CMake (3.19+ required for Android NDK 29)
          # Remove old CMake first
          sudo apt remove -y cmake || true
          
          # Download and install CMake 3.28+ directly from Kitware
          CMAKE_VERSION="3.28.3"
          CMAKE_BUILD="cmake-${CMAKE_VERSION}-linux-x86_64"
          
          cd /tmp
          wget -q "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/${CMAKE_BUILD}.tar.gz"
          tar -xzf "${CMAKE_BUILD}.tar.gz"
          
          # Handle potential conflicts with existing files in /usr/local
          sudo rm -f /usr/local/man 2>/dev/null || true
          sudo mkdir -p /usr/local/man
          
          # Copy CMake files carefully
          sudo cp -rf "${CMAKE_BUILD}/bin"/* /usr/local/bin/ 2>/dev/null || true
          sudo cp -rf "${CMAKE_BUILD}/share"/* /usr/local/share/ 2>/dev/null || true
          sudo cp -rf "${CMAKE_BUILD}/man"/* /usr/local/man/ 2>/dev/null || true
          
          # Ensure cmake is in PATH for subsequent steps
          echo "/usr/local/bin" >> $GITHUB_PATH
          
          # Verify installation
          echo "Installed CMake version:"
          /usr/local/bin/cmake --version

      - name: Set Android Build Environment Variables
        run: |
          # Set Android platform and ABI for CMake/Rust builds
          echo "ANDROID_PLATFORM=android-24" >> $GITHUB_ENV
          echo "ANDROID_API=24" >> $GITHUB_ENV
          
          # These help ensure consistent builds across architectures
          echo "ANDROID_NDK_VERSION=29" >> $GITHUB_ENV

      - name: Verify NDK and Build Environment
        run: |
          echo "=== Android NDK Configuration ==="
          echo "ANDROID_NDK=$ANDROID_NDK"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"
          echo "CMAKE_TOOLCHAIN_FILE=$CMAKE_TOOLCHAIN_FILE"
          echo "ANDROID_PLATFORM=$ANDROID_PLATFORM"
          echo "ANDROID_API=$ANDROID_API"
          
          echo ""
          echo "=== Verifying NDK Installation ==="
          if [ -d "$ANDROID_NDK" ]; then
            echo "✅ NDK directory exists"
            ls -la "$ANDROID_NDK" | head -10
          else
            echo "❌ NDK directory not found!"
            exit 1
          fi
          
          echo ""
          echo "=== Verifying CMake Toolchain ==="
          if [ -f "$CMAKE_TOOLCHAIN_FILE" ]; then
            echo "✅ CMake toolchain file exists"
          else
            echo "⚠️  CMake toolchain file not found (may cause issues)"
          fi
          
          echo ""
          echo "=== Build Tools ==="
          which cmake && cmake --version | head -1
          which make && make --version | head -1
          which ninja && ninja --version

      - name: Check Flutter
        run: flutter doctor

      - name: Install Dependencies
        run: flutter pub get

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks

      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=keystore.jks" >> android/key.properties

      - name: Decode Firebase Configuration Files
        run: |
          echo "Decoding google-services.json..."
          echo "${{ secrets.GOOGLE_SERVICE_JSON }}" | base64 --decode > android/app/google-services.json
          echo "Decoding firebase_options.dart..."
          echo "${{ secrets.FIREBASE_OPTIONS }}" | base64 --decode > lib/firebase_options.dart
          echo "Verifying decoded files..."
          ls -lh android/app/google-services.json
          ls -lh lib/firebase_options.dart

      - name: Build APK (Split per ABI)
        env:
          # Explicitly set Android ABI for Rust/CMake builds
          ANDROID_ABI: armeabi-v7a,arm64-v8a
        run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64 --build-name="${{ github.event.inputs.version || github.ref_name }}" --build-number="${{ github.run_number }}"

      - name: Build App Bundle
        env:
          # Explicitly set Android ABI for Rust/CMake builds
          ANDROID_ABI: armeabi-v7a,arm64-v8a
        run: flutter build appbundle --release --target-platform android-arm,android-arm64 --build-name="${{ github.event.inputs.version || github.ref_name }}" --build-number="${{ github.run_number }}"

      - name: Verify Build Outputs
        run: |
          echo "Checking for APK files..."
          echo "Contents of build/app/outputs/flutter-apk/:"
          ls -lh build/app/outputs/flutter-apk/

          APK_COUNT=$(find build/app/outputs/flutter-apk/ -name "*.apk" -type f | wc -l)
          if [ "$APK_COUNT" -gt 0 ]; then
            echo "✅ Found $APK_COUNT APK file(s):"
            find build/app/outputs/flutter-apk/ -name "*.apk" -type f -exec ls -lh {} \;
          else
            echo "❌ No APK files found"
            exit 1
          fi

          echo ""
          echo "Checking for AAB file..."
          if [ -f "build/app/outputs/bundle/release/app-release.aab" ]; then
            echo "✅ AAB found: build/app/outputs/bundle/release/app-release.aab"
            ls -lh build/app/outputs/bundle/release/app-release.aab
          else
            echo "❌ AAB not found at expected location"
            echo "Contents of build/app/outputs/bundle/release/:"
            ls -la build/app/outputs/bundle/release/ || echo "Directory does not exist"
            exit 1
          fi

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/app-release.aab
          retention-days: 1

  build-ios:
    name: Build iOS (IPA)
    runs-on: macos-latest
    environment: BuildEnv
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-apple-ios

      - name: Setup Flutter SDK
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: latest

      - name: Install Dependencies
        run: flutter pub get

      - name: Decode Firebase Configuration Files
        run: |
          echo "Decoding firebase_options.dart..."
          echo "${{ secrets.FIREBASE_OPTIONS }}" | base64 --decode > lib/firebase_options.dart
          echo "Decoding GoogleService-Info.plist..."
          echo "${{ secrets.GOOGLE_SERVICE_PLIST }}" | base64 --decode > ios/Runner/GoogleService-Info.plist
          echo "Verifying decoded files..."
          ls -lh lib/firebase_options.dart
          ls -lh ios/Runner/GoogleService-Info.plist

      - name: Clean iOS Build
        run: |
          cd ios
          rm -rf Pods Podfile.lock
          pod cache clean --all || true
          cd ..
          flutter clean

      - name: Build iOS IPA (No Code Sign)
        run: flutter build ipa --release --no-codesign --build-name="${{ github.event.inputs.version || github.ref_name }}" --build-number="${{ github.run_number }}"

      - name: Package IPA from Archive
        run: |
          cd build/ios/archive
          ARCHIVE_NAME=$(ls -t | grep ".xcarchive" | head -n 1)
          echo "Found archive: $ARCHIVE_NAME"
          mkdir -p Payload
          cp -r "$ARCHIVE_NAME/Products/Applications/Runner.app" Payload/
          zip -r Runner.ipa Payload
          mv Runner.ipa ../../../
          cd ../../..
          echo "IPA created at: $(pwd)/Runner.ipa"
          ls -lh Runner.ipa

      - name: Upload iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-builds
          path: Runner.ipa
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: [build-android, build-ios]
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Download Android Artifacts
        uses: actions/download-artifact@v5
        with:
          name: android-builds
          path: android-builds

      - name: Download iOS Artifacts
        uses: actions/download-artifact@v5
        with:
          name: ios-builds
          path: ios-builds

      - name: Verify Downloaded Artifacts
        run: |
          echo "=== Android Artifacts ==="
          echo "Contents of android-builds directory:"
          find android-builds -type f -name "*.apk" -o -name "*.aab" | head -10
          ls -la android-builds/ || echo "android-builds directory not found"

          echo "=== iOS Artifacts ==="
          echo "Contents of ios-builds directory:"
          find ios-builds -type f -name "*.ipa" | head -10
          ls -la ios-builds/ || echo "ios-builds directory not found"

      - name: Get Release Version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Prepare Release Files
        run: |
          echo "Preparing release files..."

          # Get repository name and version
          REPO_NAME="${{ github.repository }}"
          REPO_NAME=$(echo "$REPO_NAME" | cut -d'/' -f2)  # Extract repo name from owner/repo
          VERSION="${{ steps.version.outputs.version }}"

          echo "Repository name: $REPO_NAME"
          echo "Version: $VERSION"

          # Find and copy all APK files
          APK_FILES=$(find android-builds -name "*.apk" -type f)
          APK_COUNT=$(echo "$APK_FILES" | wc -l)

          if [ "$APK_COUNT" -gt 0 ]; then
            echo "Found $APK_COUNT APK file(s):"
            while IFS= read -r APK_FILE; do
              # Extract the architecture or type from the filename
              BASENAME=$(basename "$APK_FILE" .apk)

              # Rename files appropriately
              if [[ "$BASENAME" == *"armeabi-v7a"* ]]; then
                APK_NAME="${REPO_NAME}-${VERSION}-armeabi-v7a.apk"
              elif [[ "$BASENAME" == *"arm64-v8a"* ]]; then
                APK_NAME="${REPO_NAME}-${VERSION}-arm64-v8a.apk"
              elif [[ "$BASENAME" == *"universal"* ]]; then
                APK_NAME="${REPO_NAME}-${VERSION}-universal.apk"
              else
                APK_NAME="${REPO_NAME}-${VERSION}.apk"
              fi

              cp "$APK_FILE" "./$APK_NAME"
              echo "✅ APK file prepared as: $APK_NAME"
            done <<< "$APK_FILES"
          else
            echo "❌ No APK files found in android-builds"
            exit 1
          fi

          # Find and copy AAB file
          AAB_FILE=$(find android-builds -name "*.aab" -type f | head -1)
          if [ -n "$AAB_FILE" ]; then
            echo "Found AAB: $AAB_FILE"
            AAB_NAME="${REPO_NAME}-${VERSION}.aab"
            cp "$AAB_FILE" "./$AAB_NAME"
            echo "✅ AAB file prepared as: $AAB_NAME"
          else
            echo "❌ No AAB file found in android-builds"
            exit 1
          fi

          # Find and copy IPA file
          IPA_FILE=$(find ios-builds -name "*.ipa" -type f | head -1)
          if [ -n "$IPA_FILE" ]; then
            echo "Found IPA: $IPA_FILE"
            IPA_NAME="${REPO_NAME}-${VERSION}.ipa"
            cp "$IPA_FILE" "./$IPA_NAME"
            echo "✅ IPA file prepared as: $IPA_NAME"
          else
            echo "❌ No IPA file found in ios-builds"
            exit 1
          fi

          echo ""
          echo "Release files prepared:"
          ls -lh ${REPO_NAME}-${VERSION}*

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          files: |
            ${{ github.event.repository.name }}-${{ steps.version.outputs.version }}-*.apk
            ${{ github.event.repository.name }}-${{ steps.version.outputs.version }}.aab
            ${{ github.event.repository.name }}-${{ steps.version.outputs.version }}.ipa
          token: ${{ secrets.RELEASE_PAT }}
